# MEDORA production stack on one server: PostgreSQL, API, web app, Caddy (HTTPS) and nightly encrypted backups.
#   cp deploy/.env.example deploy/.env   # fill in every value
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# See deploy/README.md. Only Caddy publishes ports; the database is never reachable from outside.
name: medora

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: medora
      POSTGRES_USER: medora
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medora -d medora"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-off: applies database migrations and syncs specialty presets, then exits. Runs before the API on every start.
  migrate:
    image: medora-api:${MEDORA_VERSION:-latest}
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    restart: "no"
    working_dir: /app
    command: ["sh", "-c", "node db/migrate.js && node db/sync_presets.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://medora:${DB_OWNER_PASSWORD}@db:5432/medora
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
    depends_on: { db: { condition: service_healthy } }

  api:
    image: medora-api:${MEDORA_VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_DATABASE_URL: postgres://medora_app:${DB_APP_PASSWORD}@db:5432/medora
      WEB_ORIGIN: ${PUBLIC_URL:-https://${DOMAIN}}
      WEB_BASE_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      MFA_ENC_KEY: ${MFA_ENC_KEY:?set MFA_ENC_KEY}
      FILE_ENC_KEY: ${FILE_ENC_KEY:?set FILE_ENC_KEY}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${WHATSAPP_DEFAULT_COUNTRY_CODE:-961}
      EMAIL_PROVIDER_API_KEY: ${EMAIL_PROVIDER_API_KEY:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
    volumes: [files:/data/storage]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    image: medora-web:${MEDORA_VERSION:-latest}
    build: { context: .., dockerfile: deploy/web.Dockerfile, args: { API_URL: "http://api:4000" } }
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api]

  backup:
    image: medora-backup:${MEDORA_VERSION:-latest}
    build: { context: .., dockerfile: deploy/backup.Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://medora:${DB_OWNER_PASSWORD}@db:5432/medora
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE}
      STORAGE_DIR: /data/storage
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
    volumes:
      - files:/data/storage:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on: { db: { condition: service_healthy } }

volumes:
  db-data:
  files:
  caddy-data:
  caddy-config:
